syntax = "proto3";

package detection;

service DetectionEngine {
  rpc DetectObjects (DetectionRequest) returns (DetectionResponse);
  rpc DetectObjectsStream (DetectionRequest) returns (stream DetectionChunk);
}

message DetectionRequest {
  string task_id = 1;
  string image_url = 2;
  repeated string target_classes = 3;
  DetectionOptions options = 4;
}

message DetectionOptions {
  float confidence_threshold = 1;
  float iou_threshold = 2;
  int32 max_detections = 3;
}

message DetectionResponse {
  string task_id = 1;
  bool success = 2;
  repeated DetectedObject objects = 3;
  string error_message = 4;
}

message DetectionChunk {
  string task_id = 1;
  float progress = 2;
  repeated DetectedObject partial_objects = 3;
}

message DetectedObject {
  string class_name = 1;
  float confidence = 2;
  BoundingBox bbox = 3;
  map<string, string> attributes = 4;
}

message BoundingBox {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
}
