services:
  # 1. BullMQ 전용 Redis
  doc-flow-redis-bullmq:
    image: redis:latest
    container_name: doc-flow-redis-bullmq
    ports:
      - "6380:6379"
    volumes:
      - redis-bullmq-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  # 2. Event/PubSub 전용 Redis
  doc-flow-redis-event:
    image: redis:latest
    container_name: doc-flow-redis-event
    ports:
      - "6379:6379"
    volumes:
      - redis-event-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  redis-bullmq-data:
  redis-event-data: